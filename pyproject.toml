[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phosmmpu"
version = "0.1.0"
description = "Positive-unlabeled multimodal learning for functional phosphosite prioritization"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython==1.81",
  "lightgbm==4.6.0",
  "matplotlib==3.10.7",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "torch>=2.2",
  "transformers==4.49.0",
  "tokenizers==0.21.4",
  "safetensors==0.5.3",
]

[project.scripts]
phosmmpu-train = "src.multimodal.train:main"
phosmmpu-export = "src.multimodal.export_candidates:main"
phosmmpu-summarize = "src.multimodal.summarize_runs:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
